<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleixible Box</title>
    <style>
        div.container {
            display: flex;
            flex-flow: row nowrap;
            height: 300px;

            background-color: lightsalmon;

        }
        div.item {
            background-color: rgb(97, 119, 133);
            border: 1px solid rgb(107, 139, 160);
            text-align: center;
            box-shadow: inset rgb(255, 255, 255) 0px 0px 4px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.5em;
            font-weight: bolder;
            color: white;
            transition-duration: 500ms;
        }
        div.item:hover {
            background-color: skyblue;
            color: black;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
