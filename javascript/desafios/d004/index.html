<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: #3D82D4;
        }
        header > h1, footer > p {
            color: white;
            text-align: center;
        }
        main {
            background: white;
            padding: 20px;
            height: 260px;
            width: 400px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0px 5px 40px rgba(0, 0, 0, 0.375);
        }
        main > p {
            background-color: lightgray;
            margin-top: 60px;
            padding: 5px;
            border-radius: 15px;
            border: 2px solid rgb(52, 117, 138);
            font-weight: 600;

        }
        input {
            margin-top: 15px;
        }
        select {
            width: 150px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tabuada</h1>
    </header>
    <main>
        <form action="#">
            <label for="txtnum">Número: </label>
            <input type="number" name="txtnum" id="txtnum">
            <input type="button" value="Gerar Tabuada" onclick="gerarTabuada()"> <br>
            <select name="selTabuada" id="selTabuada" size="10">
                <div id="tabuada">
                </div>
            </select>
        </form>
    </main>
    <footer>
        <p>CursoemVideo</p>
    </footer>
    <script src="script.js">
    </script>
</body>
</html>
